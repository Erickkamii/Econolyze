name: Deploy Back-End (Quarkus)

on:
  push:
    branches: ["main"]
    paths:
      - 'services/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            native: true
            dockerfile: Dockerfile.native
          - service: gateway-service
            native: true
            dockerfile: Dockerfile.native
          - service: financial-service
            native: false
            dockerfile: Dockerfile.native
          - service: ai-service
            native: false
            dockerfile: Dockerfile.jvm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Native Image (native services)
        if: matrix.native == true
        run: |
          cd services/${{ matrix.service }}
          chmod +x mvnw
          ./mvnw package -Pnative \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.container-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21 \
            -Dquarkus.native.native-image-xmx=4g \
            -DskipTests
          echo "==== CONTEÚDO DA PASTA TARGET ===="
          ls -lh target/

      - name: Build JVM JAR (JVM services)
        if: matrix.native == false
        run: |
          cd services/${{ matrix.service }}
          chmod +x mvnw
          ./mvnw package -DskipTests
          echo "==== CONTEÚDO DA PASTA TARGET ===="
          ls -lh target/

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/src/main/docker/${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/erickkamii/${{ matrix.service }}:latest
            ghcr.io/erickkamii/${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose.yaml to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "services/compose.yaml"
          target: "/opt/econolyze"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/econolyze
            echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
            podman compose pull
            podman compose up -d
            podman image prune -f