quarkus:
  application:
    name: gateway-service

  http:
    host: 0.0.0.0
    port: 8080
    cors:
      enabled: true
      origins: "http://localhost:5173,http://localhost:3000,http://192.168.3.32:3000,http://192.168.3.9:3000,https://econolyze.vercel.app"
      methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
      headers: "accept,authorization,content-type,x-requested-with,x-xsrf-token,cookie"
      exposed-headers: "Content-Disposition"
      access-control-allow-credentials: true
      access-control-max-age: 24H
    ssl:
      certificate:
        file: /work/ssl/cert.pem
        key-file: /work/ssl/key.pem
    insecure-requests: redirect

  # Swagger
  swagger-ui:
    always-include: true
    path: /swagger-ui

  # Logging
  log:
    level: INFO
    category:
      "dev.econolyze": DEBUG
      "io.quarkus.smallrye.jwt": TRACE
      "io.quarkus.security": TRACE
      "io.smallrye.jwt": TRACE
      "org.jboss.resteasy.reactive.client": DEBUG

  # REST Clients
  rest-client:
    auth-service:
      url: http://localhost:8081
      scope: jakarta.inject.Singleton
    financial-service:
      url: http://localhost:8082
      scope: jakarta.inject.Singleton
    ai-service:
      read-timeout: 120000
      url: http://localhost:8083
      scope: jakarta.inject.Singleton

mp:
  jwt:
    verify:
      publickey:
        location: keys/publicKey.pem
      issuer: econolyze

"%dev":
  quarkus:
    log:
      console:
        format: "%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n"
        color: true

"%prod":
  quarkus:
    log:
      console:
        json: true
    rest-client:
      auth-service:
        url: ${AUTH_SERVICE_URL}
      financial-service:
        url: ${FINANCIAL_SERVICE_URL}
      ai-service:
        url: ${AI_SERVICE_URL}